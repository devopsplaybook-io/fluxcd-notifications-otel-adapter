name: Main Build

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  merge-build:
    uses: devopsplaybook-io/common-utils/.github/workflows/reusable-merge-build.yml@039402a1c1bc53a91546a7e126070e834a5d097a
    with:
      node_app_directories: '["."]'
      node_version: "26"
      audit_enabled: true
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      QUALITY_DASHBOARD_URL: ${{ secrets.QUALITY_DASHBOARD_URL }}
      QUALITY_DASHBOARD_TOKEN: ${{ secrets.QUALITY_DASHBOARD_TOKEN }}
