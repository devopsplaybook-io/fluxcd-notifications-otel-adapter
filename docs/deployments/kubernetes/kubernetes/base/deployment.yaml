apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluxcd-notifications-otel-adapter
  labels:
    app: fluxcd-notifications-otel-adapter
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: fluxcd-notifications-otel-adapter
  template:
    metadata:
      labels:
        app: fluxcd-notifications-otel-adapter
    spec:
      serviceAccountName: fluxcd-notifications-otel-adapter
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: fluxcd-notifications-otel-adapter
          name: fluxcd-notifications-otel-adapter
          # Authorization headers are secrets: they must come from a Secret
          # (secretKeyRef), never from a ConfigMap or config.json.
          env:
            - name: WEBHOOK_AUTHORIZATION_HEADER
              valueFrom:
                secretKeyRef:
                  name: fluxcd-notifications-otel-adapter-secret
                  key: WEBHOOK_AUTHORIZATION_HEADER
            - name: OPENTELEMETRY_COLLECT_AUTHORIZATION_HEADER
              valueFrom:
                secretKeyRef:
                  name: fluxcd-notifications-otel-adapter-secret
                  key: OPENTELEMETRY_COLLECT_AUTHORIZATION_HEADER
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              memory: 500Mi
              cpu: 1
            requests:
              memory: 64Mi
              cpu: 100m
          volumeMounts:
            - name: config-volume
              mountPath: /opt/app/config.json
              subPath: config.json
            - name: tmp-volume
              mountPath: /tmp
          imagePullPolicy: Always
          startupProbe:
            httpGet:
              path: /api/status
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/status
              port: 8080
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/status
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
      volumes:
        - name: config-volume
          configMap:
            name: fluxcd-notifications-otel-adapter-config
        - name: tmp-volume
          emptyDir:
            sizeLimit: 16Mi
