# https://hub.docker.com/r/devopsplaybookio/fluxcd-notifications-otel-adapter
services:
  fluxcd-notifications-otel-adapter:
    image: devopsplaybookio/fluxcd-notifications-otel-adapter:0.9.0
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    ports:
      - "8080:8080"
    volumes:
      - ./config.json:/opt/app/config.json:ro
